<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ZERO</title>
</head>
<body style="background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:sans-serif">
<div style="background:#141414;padding:28px;border-radius:16px;width:92%;max-width:360px;border:1px solid #222">
<h2>Admin - ZERO</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="Correo admin" autocomplete="email" style="width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box">
<input id="password" type="password" placeholder="Contraseña" style="width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff;box-sizing:border-box">
<button id="btn" type="submit" style="width:100%;padding:14px;margin-top:10px;border-radius:10px;border:0;font-weight:700;background:#fff;color:#000">Entrar</button>
</form>
<div id="msg" style="margin-top:12px;color:#ff6b6b;font-size:14px"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn');
  const msg=document.getElementById('msg');
  btn.textContent='Verificando...';
  btn.disabled=true;
  msg.textContent='';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  try{
    const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(d.ok){msg.style.color='#4ade80';msg.textContent='¡Entraste!';localStorage.setItem('zero_admin','1');setTimeout(()=>location.href='/admpanel/dashboard.html',800);}
    else{msg.textContent=d.error||'Credenciales incorrectas';btn.textContent='Entrar';btn.disabled=false;}
  }catch(err){msg.textContent='Error: '+err.message;btn.textContent='Entrar';btn.disabled=false;}
});
</script>
</body>
</html>
